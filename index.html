<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>모험의 땅</title>
<style>
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; overflow: hidden; }
  body { background: #000; color: #fff; font-family: system-ui, sans-serif; touch-action: none; user-select: none; -webkit-user-select: none; }
  canvas { display: block; }
  input, select, button { padding: 10px; font-size: 16px; border-radius: 8px; border: 1px solid #444; background: #22252e; color: inherit; font-family: inherit; }
  button { background: #3b6ef5; border: none; cursor: pointer; }
  button:disabled { opacity: .4; cursor: default; }
  #login { position: fixed; inset: 0; z-index: 10; display: flex; align-items: center; justify-content: center; background: radial-gradient(#2a3550, #0d0f16); }
  #login > div { display: flex; flex-direction: column; gap: 10px; width: min(300px, calc(100% - 32px)); }
  #login h1 { margin: 0 0 8px; text-align: center; font-size: 32px; }
  #login small { color: #9aa; text-align: center; }
  .panel { background: rgba(10, 12, 20, .65); border-radius: 8px; padding: 8px 10px; }
  #hud { position: fixed; inset: 0; pointer-events: none; display: none; }
  #stats { position: absolute; top: 12px; left: 12px; width: 230px; font-size: 14px; line-height: 1.5; }
  .bar { height: 8px; background: #400; border-radius: 4px; overflow: hidden; margin: 2px 0 4px; }
  .bar > div { height: 100%; background: #e44; transition: width .2s; }
  #xpbar > div { background: #ffd84a; }
  #mini { position: absolute; top: 12px; right: 12px; width: 160px; height: 120px; border-radius: 8px; border: 2px solid rgba(255,255,255,.3); }
  #zone { position: absolute; top: 140px; right: 12px; width: 160px; text-align: center; font-size: 13px; }
  #cross { position: absolute; left: 50%; top: 50%; width: 6px; height: 6px; margin: -3px; border-radius: 50%; background: #fff; box-shadow: 0 0 3px #000; }
  #banner { position: absolute; top: 22%; width: 100%; text-align: center; font-size: 34px; font-weight: 800; text-shadow: 0 2px 8px #000; opacity: 0; transition: opacity 1s; }
  #banner small { display: block; font-size: 16px; font-weight: 400; }
  #log { position: absolute; left: 12px; bottom: 64px; width: min(440px, calc(100% - 24px)); font-size: 14px; text-shadow: 0 1px 2px #000; }
  #log div { margin-top: 3px; word-break: break-all; }
  .chat { color: #fff; } .emote { color: #d7b8ff; font-style: italic; } .combat { color: #ffb39a; } .level { color: #ffd84a; } .sys { color: #bbb; } .loot { color: #8fe3ff; }
  #chat { position: absolute; left: 12px; bottom: 12px; width: min(440px, calc(100% - 24px)); pointer-events: auto; display: none; }
  #interact { position: absolute; left: 50%; bottom: 22%; transform: translateX(-50%); pointer-events: auto; display: none; background: rgba(20, 24, 36, .85); border: 1px solid #ffd84a; }
  #hurt { position: absolute; inset: 0; background: radial-gradient(transparent 50%, rgba(255,0,0,.7)); opacity: 0; transition: opacity .4s; }
  #lock { position: fixed; inset: 0; display: none; align-items: center; justify-content: center; background: rgba(0,0,0,.45); text-align: center; line-height: 1.8; cursor: pointer; }
  #lock b { font-size: 24px; }
  #panel { position: fixed; left: 50%; top: 50%; transform: translate(-50%, -50%); width: min(560px, calc(100% - 16px)); max-height: 86vh; display: none; flex-direction: column;
           background: rgba(16, 18, 28, .96); border: 1px solid #3a3f55; border-radius: 12px; z-index: 5; user-select: text; touch-action: pan-y; }
  #panel .ph { display: flex; align-items: center; gap: 10px; padding: 12px 14px; border-bottom: 1px solid #2c3042; }
  #panel .ph b { flex: 1; font-size: 18px; }
  #pbody { overflow-y: auto; padding: 6px 14px 14px; }
  #pbody h4 { margin: 14px 0 6px; color: #9aa3c0; font-size: 13px; }
  .row { display: flex; align-items: center; gap: 8px; padding: 6px 0; border-bottom: 1px solid #23273a; font-size: 14px; }
  .row > span { flex: 1; min-width: 0; }
  .row small { display: block; color: #9aa3c0; font-size: 12px; }
  .row button, .ph button { padding: 6px 10px; font-size: 13px; white-space: nowrap; }
  .sell { background: #6b5b2e; } .enh { background: #8e3b2c; } .gray { background: #3a3f55; }
  .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 4px 12px; font-size: 14px; }
  #touch { display: none; }
  @media (pointer: coarse) {
    #touch { display: block; }
    #stats { width: 200px; font-size: 12px; top: 8px; left: 8px; }
    #mini { width: 110px; height: 82px; top: 8px; right: 8px; }
    #zone { top: 94px; right: 8px; width: 110px; font-size: 11px; }
    #log { bottom: 170px; font-size: 12px; left: 8px; }
    #chat { bottom: auto; top: 8px; left: 8px; width: calc(100% - 16px); }
    #banner { font-size: 24px; }
    #joy { position: fixed; left: 24px; bottom: 24px; width: 130px; height: 130px; border-radius: 50%; background: rgba(255,255,255,.12); border: 2px solid rgba(255,255,255,.3); }
    #knob { position: absolute; left: 40px; top: 40px; width: 50px; height: 50px; border-radius: 50%; background: rgba(255,255,255,.5); }
    #touch button { position: fixed; border-radius: 50%; padding: 0; width: 54px; height: 54px; font-size: 22px; background: rgba(44, 49, 64, .85); }
    #touch #atk { right: 24px; bottom: 36px; width: 90px; height: 90px; font-size: 30px; background: rgba(192, 57, 43, .85); }
    #potBtn { right: 126px; bottom: 30px; }
    #bagBtn { right: 40px; bottom: 140px; }
    #chatBtn { right: 40px; bottom: 204px; }
  }
</style>
</head>
<body>
<div id="login"><div>
  <h1>⚔️ 모험의 땅</h1>
  <input id="name" placeholder="캐릭터 이름" maxlength="12">
  <select id="cls">
    <option value="warrior">🛡️ 전사: 체력이 높음</option>
    <option value="mage">🧙 마법사: 원거리 마법</option>
    <option value="rogue">🗡️ 도적: 치명타 40%</option>
  </select>
  <button id="start">입장</button>
  <small id="resumeHint"></small>
</div></div>
<div id="hud">
  <div id="stats" class="panel"></div>
  <canvas id="mini" width="160" height="120"></canvas>
  <div id="zone" class="panel"></div>
  <div id="cross"></div>
  <div id="banner"></div>
  <div id="hurt"></div>
  <div id="log"></div>
  <button id="interact"></button>
  <input id="chat" placeholder="대화 (/me 행동 묘사) · Enter 전송" maxlength="120" enterkeyhint="send">
</div>
<div id="panel"><div class="ph"><b>캐릭터</b><span id="gold"></span><button class="gray" data-a="close">✕</button></div><div id="pbody"></div></div>
<div id="lock"><div><b>클릭해서 플레이</b><br>WASD 이동 · 마우스 시점 · 클릭/Space 공격<br>I 가방 · E 상호작용 · Q 물약 · Enter 대화</div></div>
<div id="touch">
  <div id="joy"><div id="knob"></div></div>
  <button id="chatBtn">💬</button>
  <button id="bagBtn">🎒</button>
  <button id="potBtn">🧪</button>
  <button id="atk">⚔️</button>
</div>
<script type="importmap">{ "imports": { "three": "https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js" } }</script>
<script type="module">
import * as THREE from 'three';

const $ = id => document.getElementById(id);
const touch = matchMedia('(pointer: coarse)').matches;
const CLS_COLOR = { warrior: 0x3b6ef5, mage: 0x8e44ad, rogue: 0x34495e };
const ICON = { warrior: '🛡️', mage: '🧙', rogue: '🗡️' };
const GRADE_COLOR = { D: '#9e9e9e', C: '#5ed65e', B: '#4da6ff', A: '#b36bff', S: '#ffd84a', SS: '#ff9f1a', SSR: '#ff4fd8' };
const GRADES = ['D', 'C', 'B', 'A', 'S', 'SS', 'SSR'];
const SLOT_KO = { weapon: '무기', armor: '방어구', relic: '유물', accessory: '장식품' };
const THEMES = {
  town: { grass: [110, 150, 80], leaf: 0x2e7d32, sky: 0x9fd3ff, fog: [6, 26] },
  meadow: { grass: [78, 145, 64], leaf: 0x2e7d32, water: 0x3a8fd8, sky: 0x9fd3ff, fog: [6, 26] },
  dark: { grass: [40, 70, 46], leaf: 0x1b3b2a, water: 0x2a4f5f, sky: 0x2b3d40, fog: [3, 16] },
  snow: { grass: [222, 232, 240], leaf: 0xe6f2ff, water: 0x9fd4f0, sky: 0xd8e6f0, fog: [5, 22] },
  lava: { grass: [62, 40, 38], leaf: 0x2a1a18, water: 0xff5a1f, sky: 0x3a1512, fog: [4, 20] },
};
let token, myId, map, W, H, zones, npcs, mobs, state = { players: [], monsters: [] }, mine = null;
const me = { x: 0, y: 0, yaw: 0, pitch: 0, cls: 'warrior' };
const zoneAt = x => zones.find(z => x >= z.x0 && x < z.x1) || zones[0];
const themeOf = z => THEMES[z.theme || 'town'];

// ---------- 렌더러 / 씬 ----------
const renderer = new THREE.WebGLRenderer({ antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
document.body.prepend(renderer.domElement);
const canvas = renderer.domElement;
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x9fd3ff);
scene.fog = new THREE.Fog(0x9fd3ff, 6, 26);
const camera = new THREE.PerspectiveCamera(75, 1, 0.05, 100);
camera.rotation.order = 'YXZ';
scene.add(camera);
scene.add(new THREE.HemisphereLight(0xffffff, 0x445533, 2));
const sun = new THREE.DirectionalLight(0xfff2d0, 2);
sun.position.set(10, 20, 5);
scene.add(sun);

const lambert = (color, extra) => new THREE.MeshLambertMaterial({ color, ...extra });
const mesh = (geo, mat, x = 0, y = 0, z = 0) => { const m = new THREE.Mesh(geo, mat); m.position.set(x, y, z); return m; };
const rgb = hex => [hex >> 16 & 255, hex >> 8 & 255, hex & 255];

// ---------- 월드 ----------
function buildWorld() {
  const S = 16, cv = document.createElement('canvas');
  cv.width = W * S; cv.height = H * S;
  const g = cv.getContext('2d');
  map.forEach((row, y) => row.forEach((t, x) => {
    const th = themeOf(zoneAt(x)), grass = th.grass;
    const base = t === 2 ? rgb(th.water || 0x3a8fd8) : t === 3 || t === 4 ? [150, 132, 104] : t === 5 ? (th === THEMES.snow ? [175, 165, 150] : [140, 110, 75]) : t === 1 ? grass.map(c => c * 0.8) : grass;
    for (let i = 0; i < 4; i++) for (let j = 0; j < 4; j++) {
      const n = (Math.random() - 0.5) * 22;
      g.fillStyle = `rgb(${base[0] + n},${base[1] + n},${base[2] + n})`;
      g.fillRect(x * S + i * 4, y * S + j * 4, 4, 4);
    }
  }));
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  tex.magFilter = THREE.NearestFilter;
  const ground = mesh(new THREE.PlaneGeometry(W, H), lambert(0xffffff, { map: tex }), W / 2, 0, H / 2);
  ground.rotation.x = -Math.PI / 2;
  scene.add(ground);

  // 관문 기둥 자리에는 나무 대신 기둥
  const pillar = new Set(zones.slice(1).flatMap(z => [`${z.x0},13`, `${z.x0},18`]));
  const trees = [], waters = [], lavas = [];
  map.forEach((row, y) => row.forEach((t, x) => {
    if (t === 1 && !pillar.has(`${x},${y}`)) trees.push([x, y]);
    if (t === 2) (zoneAt(x).theme === 'lava' ? lavas : waters).push([x, y]);
  }));
  const trunk = new THREE.InstancedMesh(new THREE.CylinderGeometry(0.08, 0.12, 0.8, 6), lambert(0x6b4423), trees.length);
  const leaf1 = new THREE.InstancedMesh(new THREE.ConeGeometry(0.5, 1.1, 7), lambert(0xffffff), trees.length);
  const leaf2 = new THREE.InstancedMesh(new THREE.ConeGeometry(0.35, 0.8, 7), lambert(0xffffff), trees.length);
  const m4 = new THREE.Matrix4(), q = new THREE.Quaternion(), up = new THREE.Vector3(0, 1, 0), col = new THREE.Color();
  trees.forEach(([x, y], i) => {
    const s = 0.8 + Math.random() * 0.5, sv = new THREE.Vector3(s, s, s);
    q.setFromAxisAngle(up, Math.random() * Math.PI);
    trunk.setMatrixAt(i, m4.compose(new THREE.Vector3(x + 0.5, 0.4 * s, y + 0.5), q, sv));
    leaf1.setMatrixAt(i, m4.compose(new THREE.Vector3(x + 0.5, 1.15 * s, y + 0.5), q, sv));
    leaf2.setMatrixAt(i, m4.compose(new THREE.Vector3(x + 0.5, 1.65 * s, y + 0.5), q, sv));
    col.setHex(themeOf(zoneAt(x)).leaf).offsetHSL(0, 0, (Math.random() - 0.5) * 0.06);
    leaf1.setColorAt(i, col); leaf2.setColorAt(i, col);
  });
  scene.add(trunk, leaf1, leaf2);

  const plane = new THREE.PlaneGeometry(1, 1).rotateX(-Math.PI / 2);
  const water = new THREE.InstancedMesh(plane, new THREE.MeshPhongMaterial({ color: 0xffffff, transparent: true, opacity: 0.7, shininess: 100 }), Math.max(1, waters.length));
  waters.forEach(([x, y], i) => { water.setMatrixAt(i, m4.makeTranslation(x + 0.5, 0.03, y + 0.5)); water.setColorAt(i, col.setHex(themeOf(zoneAt(x)).water)); });
  water.count = waters.length;
  const lava = new THREE.InstancedMesh(plane, new THREE.MeshBasicMaterial({ color: 0xff6a1f }), Math.max(1, lavas.length));
  lavas.forEach(([x, y], i) => lava.setMatrixAt(i, m4.makeTranslation(x + 0.5, 0.03, y + 0.5)));
  lava.count = lavas.length;
  scene.add(water, lava);

  // 건물: 3x3 건물 타일 묶음의 왼쪽 위 모서리마다 집 한 채
  map.forEach((row, y) => row.forEach((t, x) => {
    if (t !== 4 || row[x - 1] === 4 || map[y - 1][x] === 4) return;
    scene.add(mesh(new THREE.BoxGeometry(2.8, 1.6, 2.8), lambert(0xe8d8b8), x + 1.5, 0.8, y + 1.5));
    const roof = mesh(new THREE.ConeGeometry(2.3, 1.2, 4), lambert(0x9c3b2a), x + 1.5, 2.2, y + 1.5);
    roof.rotation.y = Math.PI / 4;
    scene.add(roof);
  }));

  // 관문: 기둥 2개 + 가로대 + 구역 이름 간판
  const stone = lambert(0x8d8d8d);
  for (const z of zones.slice(1)) {
    for (const y of [13.5, 18.5]) scene.add(mesh(new THREE.BoxGeometry(0.5, 2.6, 0.5), stone, z.x0 + 0.5, 1.3, y));
    scene.add(mesh(new THREE.BoxGeometry(0.4, 0.35, 5.6), stone, z.x0 + 0.5, 2.6, 16));
    const sign = makeSprite(512, 64, 1.6);
    drawText(sign, `${z.name}  ·  Lv ${z.minLv}+`, '#ffd84a');
    sign.position.set(z.x0 + 0.5, 3.15, 16);
    scene.add(sign);
  }

  // 마을 NPC
  for (const n of npcs) {
    const g = makePlayer('warrior', n.type === 'shop' ? 0x2e8b57 : 0x6d4c41);
    g.position.set(n.x, 0, n.y);
    g.rotation.y = Math.PI; // 길 쪽(+z)을 바라봄
    const sign = makeSprite(256, 64);
    drawText(sign, n.type === 'shop' ? '🛒 상인' : '🔨 대장장이', '#fff');
    sign.position.y = 1.1;
    g.add(sign);
    scene.add(g);
  }
  drawMiniBase();
}

// ---------- 캐릭터 / 몬스터 모델 ----------
function makePlayer(cls, color = CLS_COLOR[cls]) {
  const g = new THREE.Group();
  g.add(mesh(new THREE.CapsuleGeometry(0.17, 0.3, 4, 10), lambert(color), 0, 0.35, 0));
  g.add(mesh(new THREE.SphereGeometry(0.13, 12, 10), lambert(0xf1c9a5), 0, 0.72, 0));
  if (cls === 'mage') g.add(mesh(new THREE.ConeGeometry(0.15, 0.3, 10), lambert(0x5b2c83), 0, 0.92, 0));
  const arm = new THREE.Group();
  arm.position.set(0.22, 0.45, 0);
  arm.add(makeWeapon(cls, 0.6));
  g.add(arm);
  g.userData.arm = arm;
  return g;
}
function makeWeapon(cls, s = 1) {
  const g = new THREE.Group();
  if (cls === 'mage') {
    g.add(mesh(new THREE.CylinderGeometry(0.018, 0.022, 0.75), lambert(0x6b4423), 0, 0.1, 0));
    g.add(mesh(new THREE.SphereGeometry(0.06, 12, 10), lambert(0xc77dff, { emissive: 0x9d4edd }), 0, 0.5, 0));
  } else {
    const len = cls === 'rogue' ? 0.3 : 0.55;
    g.add(mesh(new THREE.BoxGeometry(0.045, len, 0.012), new THREE.MeshPhongMaterial({ color: 0xdfe6ee, shininess: 120 }), 0, 0.08 + len / 2, 0));
    g.add(mesh(new THREE.BoxGeometry(0.16, 0.03, 0.04), lambert(0xd4a017), 0, 0.08, 0));
    g.add(mesh(new THREE.CylinderGeometry(0.018, 0.018, 0.12), lambert(0x4a2c17), 0, 0.01, 0));
  }
  g.scale.setScalar(s);
  return g;
}
// 몬스터 = 3가지 기본 모델 × 색 × 크기. 바깥 그룹은 위치/회전, 안쪽 그룹만 크기 조절(이름표는 크기 유지)
function makeMonster(model, color, scale) {
  const g = new THREE.Group(), b = new THREE.Group(), eye = lambert(0x111111), red = lambert(0xff3333, { emissive: 0xaa0000 });
  if (model === 'slime') {
    const body = mesh(new THREE.SphereGeometry(0.3, 16, 12), new THREE.MeshPhongMaterial({ color, transparent: true, opacity: 0.85, shininess: 90 }), 0, 0.22, 0);
    body.scale.y = 0.75;
    b.add(body, mesh(new THREE.SphereGeometry(0.04), eye, -0.1, 0.3, -0.24), mesh(new THREE.SphereGeometry(0.04), eye, 0.1, 0.3, -0.24));
    g.userData.bounce = body;
  } else if (model === 'goblin') {
    const skin = lambert(color);
    b.add(mesh(new THREE.CylinderGeometry(0.15, 0.2, 0.42, 8), lambert(0x6d4c2f), 0, 0.25, 0));
    b.add(mesh(new THREE.SphereGeometry(0.16, 12, 10), skin, 0, 0.6, 0));
    for (const s of [-1, 1]) {
      const ear = mesh(new THREE.ConeGeometry(0.05, 0.2, 6), skin, s * 0.17, 0.66, 0);
      ear.rotation.z = -s * 1.2;
      b.add(ear, mesh(new THREE.SphereGeometry(0.03), red, s * 0.06, 0.63, -0.14));
    }
  } else {
    const fur = lambert(color);
    b.add(mesh(new THREE.BoxGeometry(0.3, 0.28, 0.7), fur, 0, 0.38, 0));
    b.add(mesh(new THREE.BoxGeometry(0.24, 0.22, 0.3), fur, 0, 0.5, -0.45));
    b.add(mesh(new THREE.BoxGeometry(0.12, 0.1, 0.15), fur, 0, 0.45, -0.65));
    for (const s of [-1, 1]) {
      b.add(mesh(new THREE.ConeGeometry(0.05, 0.12, 4), fur, s * 0.08, 0.66, -0.42));
      b.add(mesh(new THREE.SphereGeometry(0.025), red, s * 0.07, 0.54, -0.6));
      b.add(mesh(new THREE.BoxGeometry(0.07, 0.25, 0.07), fur, s * 0.1, 0.12, -0.25), mesh(new THREE.BoxGeometry(0.07, 0.25, 0.07), fur, s * 0.1, 0.12, 0.25));
    }
    const tail = mesh(new THREE.BoxGeometry(0.06, 0.06, 0.3), fur, 0, 0.45, 0.45);
    tail.rotation.x = 0.6;
    b.add(tail);
  }
  b.scale.setScalar(scale);
  g.add(b);
  // 피격 시 붉게 번쩍이기 위해 원래 발광색 기억
  g.traverse(o => o.isMesh && (o.material.userData.e = o.material.emissive.getHex()));
  return g;
}

// 이름표/말풍선/간판: 캔버스를 텍스처로 쓰는 스프라이트
function makeSprite(w = 256, h = 64, scale = 1) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const tex = new THREE.CanvasTexture(cv);
  tex.colorSpace = THREE.SRGBColorSpace;
  const s = new THREE.Sprite(new THREE.SpriteMaterial({ map: tex, depthWrite: false }));
  s.scale.set(scale * w / h * 0.25, scale * 0.25, 1);
  s.userData.cv = cv;
  return s;
}
function drawText(s, text, color) {
  const cv = s.userData.cv, g = cv.getContext('2d');
  g.clearRect(0, 0, cv.width, cv.height);
  g.font = 'bold 28px sans-serif'; g.textAlign = 'center'; g.textBaseline = 'middle';
  g.lineWidth = 5; g.strokeStyle = '#000'; g.strokeText(text, cv.width / 2, cv.height / 2);
  g.fillStyle = color; g.fillText(text, cv.width / 2, cv.height / 2);
  s.material.map.needsUpdate = true;
}
function drawTag(s, name, hp, max, color) {
  const g = s.userData.cv.getContext('2d');
  g.clearRect(0, 0, 256, 64);
  g.font = 'bold 24px sans-serif'; g.textAlign = 'center';
  g.lineWidth = 4; g.strokeStyle = '#000'; g.strokeText(name, 128, 26);
  g.fillStyle = '#fff'; g.fillText(name, 128, 26);
  g.fillStyle = '#000'; g.fillRect(48, 38, 160, 12);
  g.fillStyle = color; g.fillRect(50, 40, 156 * Math.max(0, hp) / max, 8);
  s.material.map.needsUpdate = true;
}
function drawBubble(s, text) {

const ents = new Map();
function sync() {
  const seen = new Set();
  for (const p of state.players) {
    if (p.id === myId) continue;
    const k = 'p' + p.id;
    seen.add(k);
    let e = ents.get(k);
    if (!e) {
      e = { obj: makePlayer(p.cls), tag: makeSprite(), bubble: makeSprite(512, 64) };
      e.tag.position.y = 1.05; e.bubble.position.y = 1.35;
      e.obj.add(e.tag, e.bubble);
      e.obj.position.set(p.x, 0, p.y);
      scene.add(e.obj);
      ents.set(k, e);
    }
    Object.assign(e, { tx: p.x, ty: p.y, yaw: p.yaw, swing: p.swing });
    const key = `${p.name}|${p.lv}|${p.hp}`;
    if (e.key !== key) { e.key = key; drawTag(e.tag, `${p.name} Lv${p.lv}`, p.hp, p.maxHp, '#4e4'); }
    if (e.say !== p.say) { e.say = p.say; drawBubble(e.bubble, p.say); }
  }
  for (const m of state.monsters) {
    const k = 'm' + m.id, d = mobs[m.type];
    seen.add(k);
    let e = ents.get(k);
    if (!e) {
      e = { obj: makeMonster(d.model, d.color, d.scale), tag: makeSprite(), monster: true };
      e.tag.position.y = (d.model === 'slime' ? 0.55 : 0.9) * d.scale + 0.15;
      if (d.boss) e.tag.scale.multiplyScalar(2);
      e.obj.add(e.tag);
      e.obj.position.set(m.x, 0, m.y);
      scene.add(e.obj);
      ents.set(k, e);
    }
    if (e.tx !== undefined && (m.x !== e.tx || m.y !== e.ty)) e.yaw = Math.atan2(-(m.x - e.tx), -(m.y - e.ty));
    Object.assign(e, { tx: m.x, ty: m.y });
    if (e.hp !== m.hp) { e.hp = m.hp; drawTag(e.tag, d.name, m.hp, m.maxHp, '#e44'); }
    e.obj.traverse(o => o.isMesh && o.material.emissive.setHex(m.hit ? 0xff2222 : o.material.userData.e));
  }
  for (const [k, e] of ents) if (!seen.has(k)) { scene.remove(e.obj); ents.delete(k); }
}

const store = { get: k => { try { return localStorage.getItem(k); } catch { return null; } }, set: (k, v) => { try { localStorage.setItem(k, v); } catch {} } };

const act = a => token && fetch('/act', { method: 'POST', body: JSON.stringify({ token, ...a }) });
let es;
function connect() {
  const q = new URLSearchParams({ name: $('name').value, cls: $('cls').value });
  const saved = token || store.get('rpg-token');
  if (saved) q.set('resume', saved);
  es = new EventSource('/events?' + q);
  es.addEventListener('init', e => {
    const d = JSON.parse(e.data), first = !map;
    ({ token, id: myId, map, W, H, zones, npcs, mobs } = d);
    store.set('rpg-token', token);
    me.cls = d.cls; me.x = d.x; me.y = d.y;

  es.addEventListener('log', e => addLog(JSON.parse(e.data)));

  es.onerror = () => { es.close(); addLog({ text: '서버 연결이 끊겼습니다. 재연결 중...', kind: 'sys' }); setTimeout(connect, 1500); };

const keys = {};
let lastAtk = 0, swingAt = 0;
function attack() {
  const now = performance.now();
  if (now - lastAtk < 400 || panelOpen) return;
  lastAtk = swingAt = now;
  act({ type: 'attack', yaw: me.yaw });
  if (me.cls === 'mage') fireBolt();
}
const potion = () => act({ type: 'potion' });
const chat = $('chat');
const chatOpen = () => chat.style.display === 'block';
function updateLock() { $('lock').style.display = touch || !map || document.pointerLockElement || chatOpen() || panelOpen ? 'none' : 'flex'; }
function openChat() { document.exitPointerLock?.(); chat.style.display = 'block'; chat.focus(); updateLock(); }
function closeChat() { chat.value = ''; chat.style.display = 'none'; chat.blur(); if (!touch) canvas.requestPointerLock(); updateLock(); }
chat.onkeydown = e => {
  e.stopPropagation();

  if (e.key === 'Escape') closeChat();

  if (!map) return;

  if (e.code === 'Escape' && panelOpen) return closePanel();
  if (panelOpen) return;
  keys[e.code] = true;
  if (e.code === 'Space') { attack(); e.preventDefault(); }

  if (e.code === 'KeyE' && nearNpc()) openPanel();
});
addEventListener('keyup', e => { keys[e.code] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

$('lock').onclick = () => canvas.requestPointerLock();
document.addEventListener('pointerlockchange', updateLock);
canvas.addEventListener('mousedown', () => document.pointerLockElement === canvas && attack());
document.addEventListener('mousemove', e => {
  if (document.pointerLockElement !== canvas) return;
  me.yaw -= e.movementX * 0.0025;
  me.pitch = Math.max(-1.4, Math.min(1.4, me.pitch - e.movementY * 0.0025));
});

// 터치: 왼쪽 조이스틱으로 이동, 화면 드래그로 시점, 버튼으로 공격/대화/가방/물약
const joy = { id: null, x: 0, y: 0 }, look = { id: null };
$('joy').addEventListener('pointerdown', e => { joy.id = e.pointerId; $('joy').setPointerCapture(e.pointerId); moveJoy(e); });
$('joy').addEventListener('pointermove', e => e.pointerId === joy.id && moveJoy(e));
for (const ev of ['pointerup', 'pointercancel']) $('joy').addEventListener(ev, () => { joy.id = null; joy.x = joy.y = 0; $('knob').style.transform = ''; });
function moveJoy(e) {
  const r = $('joy').getBoundingClientRect();
  let dx = e.clientX - (r.left + r.width / 2), dy = e.clientY - (r.top + r.height / 2);
  const len = Math.hypot(dx, dy), max = 50;
  if (len > max) { dx *= max / len; dy *= max / len; }

}

$('chatBtn').onclick = openChat;
$('bagBtn').onclick = () => panelOpen ? closePanel() : openPanel();

// ---------- 매 프레임 ----------
const CORNERS = [[-0.25, -0.25], [0.25, -0.25], [-0.25, 0.25], [0.25, 0.25]];
let lockMsgAt = 0;
function blocked(x, y) {
  for (const [ox, oy] of CORNERS) {
    const t = map[Math.floor(y + oy)]?.[Math.floor(x + ox)];
    if (t !== 0 && t !== 3 && t !== 5) return true;
    const z = zoneAt(x + ox);
    if (mine && z.minLv > mine.lv) {
      if (performance.now() - lockMsgAt > 3000) { lockMsgAt = performance.now(); addLog({ text: `🔒 ${z.name}은(는) 레벨 ${z.minLv} 이상만 들어갈 수 있다.`, kind: 'sys' }); }
      return true;
    }
  }
  return false;
}
let last = performance.now(), sentAt = 0, sent = '', walk = 0, curZone = null;
const skyTarget = new THREE.Color(0x9fd3ff), fogTarget = [6, 26];
function frame(now) {
  const dt = Math.min(0.05, (now - last) / 1000);
  last = now;
  // 이동
  let f = 0, s = 0;
  if (!chatOpen() && !panelOpen) {
    if (keys.KeyW || keys.ArrowUp) f++;
    if (keys.KeyS || keys.ArrowDown) f--;
    if (keys.KeyA || keys.ArrowLeft) s--;
    if (keys.KeyD || keys.ArrowRight) s++;
  }
  f -= joy.y; s += joy.x;
  const len = Math.hypot(f, s);
  if (len > 1) { f /= len; s /= len; }
  const sp = 3.5 * dt, sin = Math.sin(me.yaw), cos = Math.cos(me.yaw);
  const dx = (-sin * f + cos * s) * sp, dy = (-cos * f - sin * s) * sp;
  if (dx && !blocked(me.x + dx, me.y)) me.x += dx;
  if (dy && !blocked(me.x, me.y + dy)) me.y += dy;
  walk += Math.hypot(dx, dy) * 9;

  // 구역 진입: 이름 배너 + 하늘/안개 색 전환
  const z = zoneAt(me.x);
  if (z !== curZone) {
    curZone = z;
    const th = themeOf(z);
    skyTarget.setHex(th.sky); fogTarget[0] = th.fog[0]; fogTarget[1] = th.fog[1];
    banner(z.name, z.type === 'town' ? '안전 지대 · 상인과 대장장이가 있다' : z.type === 'boss' ? '최종 보스가 기다린다' : `사냥터 · 권장 레벨 ${z.minLv}+`);
    $('zone').textContent = `📍 ${z.name}`;
  }
  const k = 1 - Math.exp(-dt * 10), kz = 1 - Math.exp(-dt * 2);
  scene.background.lerp(skyTarget, kz);
  scene.fog.color.copy(scene.background);
  scene.fog.near += (fogTarget[0] - scene.fog.near) * kz;
  scene.fog.far += (fogTarget[1] - scene.fog.far) * kz;

  const bob = Math.sin(walk) * 0.025;
  camera.position.set(me.x, 0.62 + bob, me.y);
  camera.rotation.set(me.pitch, me.yaw, 0);

  // 무기 휘두르기 + 걷기 흔들림
  const t = (now - swingAt) / 250;
  view.rotation.set(t < 1 ? -Math.sin(t * Math.PI) * 1.3 : 0.15, t < 1 ? Math.sin(t * Math.PI) * 0.5 : 0, -0.15);
  view.position.y = -0.26 + bob * 0.6;

  // 위치 전송: 10Hz, 바뀌었을 때만
  const cur = `${me.x.toFixed(2)},${me.y.toFixed(2)},${me.yaw.toFixed(2)}`;
  if (now - sentAt > 100 && cur !== sent) { sentAt = now; sent = cur; act({ type: 'pos', x: me.x, y: me.y, yaw: me.yaw }); }

  // NPC 근처 안내 버튼
  const n = nearNpc();
  $('interact').style.display = n && !panelOpen ? 'block' : 'none';
  if (n) $('interact').textContent = `${n.type === 'shop' ? '🛒 상인과 거래' : '🔨 장비 강화'}${touch ? '' : ' (E)'}`;
  if (panelOpen && n?.type !== renderPanel.lastNpc) { renderPanel.lastNpc = n?.type; renderPanel(); }

  // 다른 엔티티 보간
  for (const e of ents.values()) {
    e.obj.position.x += (e.tx - e.obj.position.x) * k;
    e.obj.position.z += (e.ty - e.obj.position.z) * k;
    if (e.yaw !== undefined) e.obj.rotation.y = e.yaw;
    if (e.obj.userData.arm) e.obj.userData.arm.rotation.x += ((e.swing ? -1.4 : 0) - e.obj.userData.arm.rotation.x) * k * 2;
    if (e.obj.userData.bounce) e.obj.userData.bounce.position.y = 0.22 + Math.abs(Math.sin(now / 250 + e.tx)) * 0.08;
  }
  for (let i = bolts.length - 1; i >= 0; i--) {
    const b = bolts[i];
    b.t += dt;
    b.b.position.addScaledVector(b.dir, dt * 16);
    if (b.t > 0.32) { scene.remove(b.b); bolts.splice(i, 1); }
  }
  drawMini();
  renderer.render(scene, camera);
}
</script>
